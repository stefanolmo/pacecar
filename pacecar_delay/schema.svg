<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="monospace" font-size="14">
<rect width="900" height="560" fill="#fff"/>
<text x="20" y="28" font-size="18" font-weight="bold">Schema elettrico - Pacecar (Waveshare ESP32-C6-LCD-1.47)</text>
<rect x="330" y="60" width="200" height="440" fill="#eef" stroke="#000" stroke-width="2"/>
<text x="345" y="85" font-weight="bold">ESP32-C6-LCD-1.47</text>
<text x="345" y="105" font-size="12">(display integrato: GPIO 6,7,14,15,21,22)</text>
<text x="345" y="152">GPIO1 &#x2190; PLUS</text>
<text x="345" y="232">GPIO2 &#x2190; MINUS</text>
<text x="345" y="312">GPIO3 &#x2190; START</text>
<text x="345" y="392">GPIO0 &#x2192; OUT</text>
<text x="345" y="470">GND</text>
<line x1="330" y1="148" x2="150" y2="148" stroke="#000" stroke-width="2"/>
<circle cx="150" cy="148" r="3" fill="#fff" stroke="#000"/>
<line x1="150" y1="148" x2="130" y2="166" stroke="#000" stroke-width="2"/>
<circle cx="150" cy="182" r="3" fill="#fff" stroke="#000"/>
<line x1="150" y1="182" x2="150" y2="198" stroke="#000" stroke-width="2"/>
<line x1="150" y1="198" x2="60" y2="198" stroke="#000" stroke-width="2"/>
<circle cx="60" cy="198" r="4"/>
<text x="20" y="142">SW1 +1s (NO)</text>
<line x1="330" y1="228" x2="150" y2="228" stroke="#000" stroke-width="2"/>
<circle cx="150" cy="228" r="3" fill="#fff" stroke="#000"/>
<line x1="150" y1="228" x2="130" y2="246" stroke="#000" stroke-width="2"/>
