<line x1="800" y1="196" x2="800" y2="230" stroke="#000" stroke-width="2"/>
<line x1="800" y1="230" x2="738" y2="230" stroke="#000" stroke-width="2"/>
<text x="820" y="188" font-size="12">D1 1N4007</text>
<!-- R2 pull-down base (livello sicuro in reset/boot) -->
<line x1="680" y1="388" x2="680" y2="410" stroke="#000" stroke-width="2"/>
<circle cx="680" cy="388" r="3"/>
<rect x="672" y="410" width="16" height="36" fill="#fff" stroke="#000" stroke-width="2"/>
<line x1="680" y1="446" x2="680" y2="466" stroke="#000" stroke-width="2"/>
<text x="596" y="432" font-size="12">R2 10k</text>
<text x="574" y="447" font-size="12">pull-down</text>
</svg>