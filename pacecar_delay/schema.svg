<line x1="60" y1="358" x2="60" y2="466" stroke="#000" stroke-width="2"/>
<line x1="60" y1="466" x2="330" y2="466" stroke="#000" stroke-width="2"/>
<line x1="60" y1="198" x2="60" y2="198" stroke="#000"/>
<text x="20" y="490" font-size="12">GND comune (pull-up interni: INPUT_PULLUP)</text>
<line x1="530" y1="388" x2="600" y2="388" stroke="#000" stroke-width="2"/>
<rect x="600" y="378" width="50" height="20" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="603" y="373" font-size="12">R1 1k</text>
<line x1="650" y1="388" x2="700" y2="388" stroke="#000" stroke-width="2"/>
<circle cx="725" cy="388" r="25" fill="#fff" stroke="#000" stroke-width="2"/>
<line x1="712" y1="370" x2="712" y2="406" stroke="#000" stroke-width="3"/>
<line x1="700" y1="388" x2="712" y2="388" stroke="#000" stroke-width="2"/>
<line x1="712" y1="378" x2="738" y2="360" stroke="#000" stroke-width="2"/>
<line x1="738" y1="360" x2="738" y2="230" stroke="#000" stroke-width="2"/>
<line x1="712" y1="398" x2="738" y2="416" stroke="#000" stroke-width="2"/>
<line x1="738" y1="416" x2="738" y2="466" stroke="#000" stroke-width="2"/>
<line x1="330" y1="466" x2="738" y2="466" stroke="#000" stroke-width="2"/>
<line x1="710" y1="466" x2="766" y2="466" stroke="#000" stroke-width="2"/>
<line x1="720" y1="472" x2="756" y2="472" stroke="#000" stroke-width="2"/>
<line x1="730" y1="478" x2="746" y2="478" stroke="#000" stroke-width="2"/>
<text x="765" y="362">Q1 2N2222 / BC337 (NPN)</text>
<text x="765" y="380" font-size="12">C = alto, E = basso</text>
<rect x="718" y="150" width="40" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="708" y="170" text-anchor="end">CARICO</text>
<text x="708" y="188" font-size="12" text-anchor="end">(relay/LED/solenoide)</text>
<text x="708" y="206" font-size="12" text-anchor="end">max ~100 mA (NPN)</text>
<line x1="738" y1="150" x2="738" y2="110" stroke="#000" stroke-width="2"/>
<line x1="738" y1="110" x2="600" y2="110" stroke="#000" stroke-width="2"/>
<text x="560" y="106">+V carico (5..12 V)</text>
<text x="770" y="262" font-size="12">D1 obbligatorio se il carico</text>
<text x="770" y="277" font-size="12">e' induttivo (relay, solenoide)</text>
<text x="770" y="292" font-size="12">Oltre 100 mA: MOSFET logic-level</text>
<text x="20" y="520" font-size="12">Il GND del carico e il GND della scheda devono essere in comune.</text>
<text x="20" y="538" font-size="12">GPIO0 = 3.3 V, max ~10 mA: carichi solo tramite Q1. Solo LED di test: GPIO0 -> 330 ohm -> LED -> GND.</text>
<!-- D1 flyback: catodo a +V, anodo al collettore -->
<line x1="738" y1="130" x2="800" y2="130" stroke="#000" stroke-width="2"/>
<line x1="800" y1="130" x2="800" y2="168" stroke="#000" stroke-width="2"/>
<line x1="788" y1="168" x2="812" y2="168" stroke="#000" stroke-width="3"/>
