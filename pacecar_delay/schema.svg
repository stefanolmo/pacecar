<line x1="150" y1="262" x2="150" y2="278" stroke="#000" stroke-width="2"/>
<line x1="150" y1="278" x2="60" y2="278" stroke="#000" stroke-width="2"/>
<circle cx="60" cy="278" r="4"/>
<text x="20" y="222">SW2 -1s (NO)</text>
<line x1="330" y1="308" x2="150" y2="308" stroke="#000" stroke-width="2"/>
<circle cx="150" cy="308" r="3" fill="#fff" stroke="#000"/>
<line x1="150" y1="308" x2="130" y2="326" stroke="#000" stroke-width="2"/>
<circle cx="150" cy="342" r="3" fill="#fff" stroke="#000"/>
<line x1="150" y1="342" x2="150" y2="358" stroke="#000" stroke-width="2"/>
<line x1="150" y1="358" x2="60" y2="358" stroke="#000" stroke-width="2"/>
<circle cx="60" cy="358" r="4"/>
<text x="20" y="302">SW3 START (NO)</text>
